decisions:
  - fifo: "Satış maliyeti tarih bazlı FIFO — KULLANICI ONAYLADI: maliyet kilitlenmez, eski satış eski alış maliyetini alır (zam olabilir). Yöntemi DEĞİŞTİRME, sabit fiyat listesine çevirme. Yalnız yanlış OKUNMUŞ fatura satırı düzeltilir. DİKKAT: fifo-cost.js yalnız stock_movements değerini okur; purchase_adjustments (price-adjustment) stok hareketi yazmıyorsa FIFO görmez → düzeltme yolunun hareket yazdığını doğrula ya da fifoProduct'a ekle, sonra POST /api/ec/cost-fifo {all:true}."
  - kdv: "Satış KDV dahil = satırın kendi oranı; maliyet KDV dahil = ürün profil oranı. Kullanıcı: bütün ürünler %20. İstersen HB'den %10 gelen satırları da %20'ye çevir (KDV hariç ciro/katkı için); şu an 8 HB satırı %10 (4332820217, 4746566211, 4215556069, 4469027298, 4651839926, 4592463585, 4310938505, 4011994299). ec_order_line_lock teslimli satırı kilitler → migration ya da özel düzeltme gerekir."
  - son_gozlem: "Aynı kesinti farklı raporlarda farklı tutarla gelirse son gözlenen (source_time) sayılır; eski test 'hesaplanmadı' bekliyordu, güncellendi."
  - iade_kesintisi: "Müşteri iadesi (IADE-…, TESLIM-EDILEMEDI-…) kesinti taşımaz; DUZELTME-CIFT iadeleri kopya satışı sıfırladığı için kesintiyi aynalar (dokunma)."

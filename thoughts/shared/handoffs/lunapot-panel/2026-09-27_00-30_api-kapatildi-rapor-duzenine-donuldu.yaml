done_this_session:
  - task: "TRENDYOL SENKRONU 22,5 SAATTİR DURMUŞTU. Cron 15 dakikada bir çalışıyor, hata yok, aralık dolmuş — ama sağlayıcıya hiç çıkılmamış, iz kaydı 'yapılacak iş yoktu' diyordu. Sebep ölçüldü (iz kaydına teşhis eklenerek): 'dosya 0.2sn, rapor 59.6sn, senkron 59.7sn' — rapor işleri 50 saniyelik tur bütçesinin tamamını yiyordu, en sonda duran senkrona sıra hiç gelmiyordu. Bütçenin yarısını ayırmak YETMEDİ (tek uzun çağrı payı aşıyor); senkron rapor işlerinden ÖNE alındı. Sonuç: 262 kayıt tarandı, 11 taslak, 12 paket teslim işaretlendi; teslim edilmiş TY paketi 406→418."
  - task: "HEPSİBURADA BAĞLANDI. Kullanıcı kimlikleri girdi, 667 finans kaydı çekildi. Yol boyunca ÜÇ SESSİZ VERİ HATASI: (1) HB para alanları {value,currencyCode} nesnesi, kod {amount,currency} arıyordu — her kayıt 'tutarı yok' sayılıp bütün sorgu düşüyordu; (2) paket uçları PascalCase gönderiyor (Id, Barcode, DeliveredDate…), kod camelCase arayınca kayıt SAYISI doğru görünüyor ama teslim tarihi BOŞ okunuyordu; (3) boş sonuçta uç items yerine null gönderiyor, bu 'şema bozuk' sanılıp sorgu reddediliyordu."
  - task: "HB SİPARİŞ UCUNUN BOŞ DÖNMESİ HATA DEĞİLMİŞ. Dokümanda yazıyor: o uç yalnız 'Open ve Unpacked' (paketlenmeyi bekleyen) siparişleri veriyor. Teslim/kargo/teslim edilemedi ayrı uçlarda: /packages/merchantid/{id}/delivered · /shipped · /undelivered. Üçü de eklendi, teslim onayı Trendyol'daki kuralla bağlandı (belirsizse dokunma, tarih uydurma). İlk çalıştırmada 18 paket teslim işaretlendi."
  - task: "İLAN EŞLEŞTİRME TUZAĞI. 29 Trendyol ilanının stok kodu harfi harfine 'merchantSku' (satıcı panelinde alan ADI değer olarak girilmiş) ve bu ilanlar FARKLI ürünler. Eşleştirme barkodla kodu aynı torbaya atıyordu: o koda açılacak TEK bağlantı 29 ürünü aynı stok kartına bağlardı, stok ve kâr sessizce yanlış ürüne yazılırdı. Barkod öne alındı (hem eşleştirmede hem içe aktarmada)."
  - task: "İLAN BARKODU SATIRDA SAKLANIR (migration 0059). Kullanıcı Trendyol'daki kodu düzeltemiyor; barkod ilana özgü ve doğru. Geçmiş TASLAK satırlar ham kayıttan dolduruldu (56 satırın 55'i). Eşleştirme penceresinde 'bu ilanı barkoduyla kalıcı bağla' seçeneği eklendi."
  - task: "EŞLEŞTİRMEYİ ARTIK SİSTEM YAPIYOR. Eşleşme yalnız içe aktarma anında bir kez deneniyordu; tutmadıysa bir daha hiç denenmiyordu. Bakım turu artık bekleyen taslakları yeniden deniyor (yalnız bileşeni de ürünü de olmayan satıra dokunur, kullanıcının seçimini değiştirmez, uydurmaz). İlk turda 54 ilan eşleşti; bekleyen paket 31→0."
  - task: "TESLİM EDİLEMEYEN PAKET UYARISI. HB 'teslim edilemedi' diyorsa bizde teslim duran paketin kârı yanlış sayılmış olabiliyordu, görünmüyordu. İş listesine kırmızı satır eklendi. Durum KENDİLİĞİNDEN geri alınmıyor (teslimi geri çevirmek satışı ve stoğu da geri alır). Üç paket işaretlendi."
  - task: "PAZARYERİ KESİNTİSİ API KAYITLARINDAN İŞLENEBİLİR (src/pazaryeri-kesinti.js + POST connections/<sağlayıcı>/fees). Kural: bir pakete kesinti yazılması için hem komisyonu hem kargo payı gelmiş olmalı — ölçüldü, kesintiler AYRI GÜNLERDE geliyor ve 167 paketin 59'unda ödeme var ama komisyon/kargo yok. Canlıda 0 satır yazdı (tam olanların hepsi zaten rapordan işlenmişti); değeri ileriye dönüktü."

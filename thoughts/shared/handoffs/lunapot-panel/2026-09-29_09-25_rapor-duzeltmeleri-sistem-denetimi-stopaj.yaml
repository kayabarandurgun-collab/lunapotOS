findings:
  - trendyol_stopaj_yok: "Trendyol 'Sipariş Kayıtları' raporunun 21 sütununda stopaj YOK. Eski raporları yeniden yüklemek işe yaramaz (hem veri dosyada yok, hem UNIQUE(store_id,sha256) aynı dosyayı ikinci kez almıyor)."
  - stopaj_orani: "Stopaj = KDV hariç satışın %1'i. HB'nin 205 siparişinden çıkarıldı, ima edilen çarpan 12000 (KDV %20); %10 KDV'li üründe 90,9 bps."
  - olcu_gerekmiyor: "fee-history.js'in ilk satırı: 'Kargo, hizmet bedeli ve komisyon oranı pazaryerinin GERÇEK ekstresinden gelmiş teslim edilmiş paketlerden öğrenilir; tarife ya da elle girilen ölçü beklenmez.' Kâr raporu, sipariş listesi, ana sayfa ve 'Kaça satmalıyım' bu kaynağı kullanıyor."
  - ayni_hata_iki_kez: "Çift kayıt hatası iki ayrı dosyada ayrı ayrı yamanmıştı (commit 421303b ve f9930eb). Koruma çağıran dosyada olduğu sürece üçüncü çağıran aynı hatayı doğurur — kural merkeze alındı."
  - trendyol_finans_tam: "Trendyol finans raporunun paralı sütunlarının HEPSİ okunuyor; atlanan üç sütun (Diğer, Yurtdışı Operasyon, Uluslararası Hizmet) dosyada gerçekten 0,00 TL. Sızıntı yok."


  - gemma_askida_kaliyor: "@cf/google/gemma-4-26b-a4b-it hesapta VAR ama Workers AI türü 'Text Generation'; OpenAI biçimli messages/image_url ile çağrılınca canlıda dakikalarca yanıt vermedi. OCR için tür 'Image-to-Text' olan model seçilmeli."
  - promptta_ornek_rakam_sizdi: "İlk prompt'ta 'sayıları şöyle bırak: 1.234,56 gibi' yazıyordu; model o örneği okumuş gibi yanıtına yazdı. Prompt'un kendisi uydurma kaynağı oldu — teste bağlandı."
  - govde_siniri_64kb: "worker.js bodyLimit varsayılanı 64.000 karakter; yalnız parça (chunk) uçlarında 1.000.000. OCR ucu bu yüzden 413 alıyordu."
  - cift_kayit_korumasi_fatura_duzeyinde: "tests/purchase-documents.test.js'in kendi yorumu bunu söylüyordu ama ETTN yolunda uygulanmamıştı: işlenmemiş bir belge, aynı faturanın düzgün kopyasını kilitliyordu."


decisions:
  - duzeltme_bileseninin_ciro_payi_sifir: "Ciro asıl bileşende kalsın diye. Alternatifte (asıl bileşeni silip ciroyu yenilere taşımak) kâr raporu paketi 'complete' saymayı bırakıyordu ve ciroyu taşıyan satış kaydı bileşenlerden kopuyordu."
  - ocr_otomatigi_isaret_kaldirmadan: "'Kesin değil' işaretlerini kaldırmak yerine modelden bağımsız üç kanıt arandı. Model harf hatası yapıyor; işaretleri kaldırmak yanlış rakamı sessizce deftere sokardı. En güçlü kanıt satır toplamının belge toplamını tutması — model hem satırları hem toplamı aynı yanlışla okumadıkça geçemez."
  - ettn_goruntuden_alinmaz: "Aynı belge her okumada farklı ETTN verdi. Biçimi doğru ama yanlış bir ETTN boş alandan TEHLİKELİDİR: düzgün göründüğü için kimse kontrol etmez, oysa tek harf belgeyi başka belge yapar."
  - kdv_ayarda_kodda_degil: "KDV oranları kanunla değişiyor (2023'te değişti). Ayar + varsayılan %20: kullanıcı hiçbir şey yapmıyor, oran değişirse kod yayınlamadan ayarlanıyor."
  - kilitler_birebir_geri: "Belge silme ve sipariş satırı kilidi yalnız ilgili düzeltme için düşürüldü ve canlıdaki sqlite_master tanımının kopyasıyla geri yazıldı. Koruma kaldırılmadı; versiyonlu migration sayesinde ne yapıldığı kayıtlı."
  - fiyat_profili_uydurulmadi: "Pina için 'sadece KDV' yazmak istedim, tablo reddetti: ambalaj/ölçü/ağırlık da zorunlu. Uydurma ölçü kargo tarifesini sessizce bozardı. Testle sabitlendi."


decisions:
  - internet_satis_lun_serisi: "Kullanıcı 'internet satış olarak devam et' dedi. LUN serisi portalda İnternet Satış için tanımlı ve hiç kullanılmamıştı. Faturada ödeme şekli, kargo firması, gönderim tarihi görünüyor — kanun bunları istiyor. Kullanıcının daha önce elle kestiği HB faturaları ARV serisinden düz e-Arşiv olarak gitmişti, bu alanlar onlarda yok."
  - fatura_tarihi_bugun: "23.09–01.10 arası satışlara 03.10 tarihi. Kullanıcının kararı. Geç faturalamanın muhasebe tarafı muhasebeciye bırakıldı, tavsiye verilmedi."
  - gonderilmemisler_haric: "Kullanıcı önce 'hariç tut' dedi, sonra 'hepsini kes' dedi; kargo tarihi olmadığı için yine kesilmedi ve sebebi açıklandı. Gelecek tarihli sevkiyat uydurmak yerine beklemek seçildi."
  - kurumsal_ayri_tur: "66 şahıs ayrı, 7 kurumsal ayrı. Sebep: VKN'si olmak e-Fatura mükellefi olmak demek değil; karışık yüklemede hatalı satırlar seri numarasında boşluk bırakırdı."

findings:
  - hb_faturayi_epostayla_kendi_aliyor: "EN ÖNEMLİ BULGU. HB'ye fatura YÜKLENMİYOR. Her siparişin {siparisNo}_{paketNo}@hepsifatura.com adresi var (HB'nin sipariş ucunda UserEmail alanında geliyor); EDM faturayı oraya e-postalayınca HB siparişe kendiliğinden bağlıyor. Önce kullanıcının 18:24'te elle kestiği ARV2026000000038 ile fark edildi (sipariş 4592680020 HasInvoice:true çıkmıştı), sonra 66 faturayla doğrulandı: faturasız 77 → 14."
  - ondalik_ayraci_virgul: "EDM Excel'de ondalık ayracı VİRGÜL. '157.500000' yazılınca nokta binlik ayracı sayıldı, birim fiyat 157.500.000 TL oldu, ödenecek tutar 318,00 yerine 265.000.053,00 çıktı. Taslak ONAYLANMADAN yakalandı. Tarihler ise NOKTALI (03.10.2026) ve doğru çalışıyor."
  - hb_ic_ucu_her_seyi_veriyor: "merchant.hepsiburada.com/fulfilment/api/v2/deliveries/{delivered|shipped|readytoship}?offset&limit — oturum çerezisiyle JSON veriyor. PascalCase. İçinde BillingAddress (TaxNumber, TaxOffice, UserIdentityNumber), UserEmail, kalem fiyatları, CargoCompany, DeliveryNumber, HasInvoice, ShippedDate var. Panelin ec_order_packages tablosunda müşteri/adres sütunu HİÇ YOK, API kayıtları da silinmişti — fatura verisi yalnız HB'de."
  - taslak_kontor_yemiyor: "Kontör gönderimde düşüyor, taslak oluşturmada değil. e-Arşiv faturası başına 1 kontör (66 fatura = 66 kontör). Oturum başındaki 28'lik düşüş bizim değil, kullanıcının 18:39'da kestiği 14 faturanındı."
  - edm_satir_bazinda_dogruluyor: "Excel yüklemesi satır satır sonuç veriyor: başarılı satır fatura numarası + ETTN + tür ('Internet Satış') döndürüyor, hatalı satır sebebini yazıp 0 adet oluşturuyor. 66 satır 66 başarı, 0 hata."


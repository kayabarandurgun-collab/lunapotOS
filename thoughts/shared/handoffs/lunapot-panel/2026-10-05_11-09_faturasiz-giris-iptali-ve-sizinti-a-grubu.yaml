findings:
  - iptal_tasarimindaki_uc_olcum: |
      (1) Ayna hareketi 'purchase' olmalı, 'count' DEĞİL: eksi değerli sayım ec_count_loss
          (0002_accounting.sql:33) ile UYDURMA kayıp gideri yazıyor (ölçüldü: 720 TL sahte gider).
      (2) 'İptal edildi' çapası ayna hareketinin KENDİSİ, başlıkta bayrak değil. Bayrak olsaydı
          yarım yazmada borç silinip mal rafta kalırdı; ayna çapa olunca satır aynı işlemde
          uygunluktan düşüyor ve aynası eksikken cari kaydı yazılamıyor (CANCEL_INCOMPLETE).
      (3) Her kapı hareketi ec_provisional_line_movements görünümünden okur
          (COALESCE(l.movement_id,k.movement_id)): eski kayıtlar hareket bağını AYRI tabloda
          tutuyor, bunu atlayan tasarım borcu silip malı bırakıyordu. Tamamlanma denetimi
          EXISTS değil SAYI karşılaştırması.
  - mukerrer_temizligi_dersi: |
      Aynı teslimat iki kez girilmişti ('000003' ve '6093012405584', 30.09, ₺3.496,80, üç ürün).
      İLK girilen ('000003') İPTAL EDİLEMEDİ: raf sayımı telafisi ORDER BY occurred_on,rowid
      LIMIT 1 ile İLK sayımı seçiyor, o yüzden 9 telafi hareketi ona bağlanmış. Koruma reddetti
      ve HİÇBİR ŞEY yazılmadı (öncesi/sonrası birebir ölçüldü). Temiz olan ikiz iptal edildi:
      stok 23/72/40 → 11/32/30, Tropikal borcu −56.212,80 → −52.716,00, sipariş geçmişi bozulmadı,
      uydurma gider 0. Hayatta kalan kaydın numarası '000003' kaldı ve DEĞİŞTİRİLEMEZ.
      DERS: mükerrerde önce hangisinin telafi hareketi olduğunu ölç (product-profile direction=in
      içinde 'GECICI-SAYIM-<ref>-SAT-' ile başlayanlar), telafisi OLMAYANI iptal et.
  - sizinti_yontemi: |
      MONEY_NAMES'e ad eklemek YAN HASAR yapıyor: 'sale' operations-ui kinds'de tür etiketi,
      'packaging' money-planning categories'de 'Ambalaj', 'withholding' dashboard-summary
      basis'inde 'deduction_positive'. Hepsi boşalırdı. Doğru yöntem şema/kapsayıcı bazlı:
      REPORT_CONTAINERS (totals/incoming/prior), RECIPE_MONEY (yield_qty+waste_pct taşıyan satır),
      estimateRow (type+basis+value üçlüsü), MONEY_TEXT (yalnız kuruşlu biçim maskelenir, sipariş
      numarası bozulmaz). Hepsi src/permission-policy.js içinde, testi amount-permission.test.js.
  - recete_gizlemesinin_tuzagi: |
      Reçete giderlerini gizlemek TEK BAŞINA yetmez: 'recipes' yetkisi 'amounts' İSTEMİYOR, yani
      tutar göremeyen personel reçete düzenleyebiliyor. Alanlar null dönünce eski yazma yolu
      num(input.labor) ile 400 verir ya da 0 yazıp SAHİBİNİN girdiği gideri siler. Üç parça
      birlikte gerekti: scrub + arayüzün kutuları hiç basmaması + sunucunun gönderilmeyen alanda
      saklananı koruması (worker.js recete dalındaki 'gider' yardımcısı).
  - genel_durum_personele_kapali: "public/ecommerce.js:56 sahip olmayan kullanıcıyı #overview'den çeviriyor. Önceki devirdeki 'panorama kesinti yok diyor' endişesi ORADA geçersiz; aynı hata kesinti eşleştirme (reconciliation) ekranında GERÇEK — D grubu."
  - edm_fatura_xml: "EDM ZIP'inde .xml + .xsl + .html var, PDF YOK. Yüklenecek olan .xml. Seçkin e-faturalarında SellersItemIdentification HİÇ YOK ve açıklamanın ilk sözcüğü marka adı ('Klasmann'), bu yüzden otomatik ürün eşleştirme (purchase-match.js) hiçbir yolla bağlayamıyor ve fatura TASLAK kalıyor — hata değil, kasıtlı. Bir kez elle bağlanınca aynı açıklama bir dahaki faturada kendiliğinden eşleşir."

decisions:
  - iptal_silmek_degil_telafi: "Kayıt silinmiyor (0065 IMMUTABLE_LEDGER) ve ters kaydedilmiyor (0069). Girişin stok ve cari etkisini birebir geri alan YENİ kayıtlar yazılıyor; geçmiş defterde kalıyor."
  - iptal_geri_alinamaz: "İptal kaydının kendisi ters kaydedilemiyor: mal stoktan çıkmış durumda borcun geri gelmesi yanlış olurdu. Bilinçli sınır."
  - ikizi_iptal_et: "Kullanıcı '000003' iptal edilsin dedi, koruma reddetti (siparişlere bağlı telafi). Temiz ikizi iptal edildi — sonuç aynı, sipariş geçmişi korundu. Bedeli: hayatta kalan kaydın numarası anlamsız kaldı, kullanıcıya söylendi."
  - depo_formu_kaldi: "Birleştirmede depo formu temel alındı çünkü üç özellikten ikisi ondaydı (stok önizlemesi, tek ürün için hazır açılma); Cariler formundan taslak kurtarma ona taşındı."
  - fatura_xml_pdf_ayri_grup: "Fatura kuyruğu türü İLK dosyadan alıyor (purchase-document-ui.js kuyrugaAl), bu yüzden XML ve PDF ayrı gruplanıyor. Raporlar tek grupta çünkü takeMany her dosyayı kendi tanıyor."

